services:
  mysql-db:
    image: mysql:8.0
    container_name: mqtt_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: mqtt_monitoring
      MYSQL_USER: mqtt_user
      MYSQL_PASSWORD: mqtt_pass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "mqtt_user", "-pmqtt_pass123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./pc-monitor
    container_name: mqtt_pc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://mqtt_user:mqtt_pass123@mysql-db:3306/mqtt_monitoring
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      mysql-db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: mqtt_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log: