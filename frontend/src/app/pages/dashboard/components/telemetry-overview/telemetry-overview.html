<section class="overview-grid">
  <div class="metric-card">
    <div class="metric-label">Pico status</div>
    <div class="metric-value">{{ latestStatus }}</div>
    <div class="metric-note">Latest value received from the device status topic.</div>
  </div>

  <div class="metric-card">
    <div class="metric-label">Temperature</div>
    <div class="metric-value">{{ latestTemperature }}</div>
    <div class="metric-note">Latest telemetry value received from the sensor topic.</div>
  </div>

  <div class="metric-card">
    <div class="metric-label">Humidity</div>
    <div class="metric-value">{{ latestHumidity }}</div>
    <div class="metric-note">Latest telemetry value received from the sensor topic.</div>
  </div>
</section>
