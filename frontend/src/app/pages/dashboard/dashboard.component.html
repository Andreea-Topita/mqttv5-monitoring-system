<div class="dashboard-shell">
  <div class="dashboard-container">

    <app-dashboard-header
      [connected]="status.connected"
      [periodicPublishing]="status.periodic_publishing"
      (disconnectClicked)="disconnect()"
      (logoutClicked)="logout()"
      (chartsClicked)="goToCharts()"
    ></app-dashboard-header>

    <div class="alert success" *ngIf="infoMessage">
      {{ infoMessage }}
    </div>

    <div class="alert error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <app-telemetry-overview
      [latestStatus]="latestStatus"
      [latestTemperature]="latestTemperature"
      [latestHumidity]="latestHumidity"
    ></app-telemetry-overview>

    <section class="main-grid">
      <app-publish-panel
        [topics]="topics"
        [status]="status"
        (statusRefreshRequested)="handleStatusRefreshRequested()"
      ></app-publish-panel>

      <app-subscription-panel
        [topics]="topics"
        [status]="status"
        (activeTopicChanged)="setActiveMessageTopic($event)"
        (subscriptionChanged)="handleSubscriptionChanged($event)"
      ></app-subscription-panel>
    </section>

    <app-live-messages-panel
      [status]="status"
      [activeMessageTopic]="activeMessageTopic"
      [displayedMessages]="displayedMessages"
      (activeMessageTopicChange)="setActiveMessageTopic($event)"
      (clearMessagesClicked)="clearLiveMessages()"
    ></app-live-messages-panel>

    <app-message-history-panel
      [topics]="topics"
    ></app-message-history-panel>

  </div>
</div>
